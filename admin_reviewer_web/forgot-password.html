<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Password recovery — FacultyLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <style>
    .steps { max-width: 480px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 24px; }
    .step { display: none; }
    .step.active { display: block; }
    .demo-banner { background: #fff8e1; border: 1px solid #ffe082; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body style="background:var(--fl-navy-deep)">
  <main style="min-height:100vh;padding:2rem">
    <a href="login.html" class="back" style="color:#bdccdf;display:inline-block;margin-bottom:1rem">← Back to sign in</a>
    <div class="steps">
      <div class="demo-banner"><strong>Demonstration only.</strong> Email delivery and verification codes are simulated until Flask backend and mail services are integrated.</div>
      <h1 style="color:#102d50;margin-top:0">Recover password</h1>
      <section class="step active" data-step="1">
        <p class="muted">Enter your institution email.</p>
        <div class="field"><label for="em">Email</label><div class="input-wrap"><input id="em" type="email" /></div></div>
        <button class="btn-submit" type="button" data-next="2">Send verification code</button>
      </section>
      <section class="step" data-step="2">
        <p class="muted">Enter the 6-digit code (demo code: <strong>123456</strong>).</p>
        <div class="field"><label for="code">Verification code</label><div class="input-wrap"><input id="code" maxlength="6" /></div></div>
        <button class="btn-submit" type="button" data-next="3">Verify</button>
      </section>
      <section class="step" data-step="3">
        <p class="muted">Choose a new password.</p>
        <div class="field"><label for="np">New password</label><div class="input-wrap"><input id="np" type="password" /></div></div>
        <p class="form-error" id="recErr"></p>
        <button class="btn-submit" type="button" id="finishRec">Update password (demo)</button>
      </section>
    </div>
  </main>
  <script type="module">
    let step = 1;
    const show = (n) => {
      step = n;
      document.querySelectorAll('.step').forEach((s) => s.classList.toggle('active', Number(s.dataset.step) === n));
    };
    document.querySelectorAll('[data-next]').forEach((b) => {
      b.addEventListener('click', () => show(Number(b.dataset.next)));
    });
    document.getElementById('finishRec').addEventListener('click', () => {
      const np = document.getElementById('np').value;
      if (np.length < 8) {
        document.getElementById('recErr').textContent = 'Password must be at least 8 characters (demo validation).';
        return;
      }
      alert('Demonstration: password reset recorded locally only. Use documented demo credentials.');
      location.href = '/login.html';
    });
  </script>
</body>
</html>
