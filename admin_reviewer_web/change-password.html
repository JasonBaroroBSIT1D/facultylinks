<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Set your password — FacultyLink</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/brand.css" />
  <link rel="icon" type="image/jpeg" href="assets/FacultyLink-logo.jpg" />
</head>
<body class="recovery-body">
  <main class="recovery-shell">
    <div class="login-card recovery-card">
      <div class="fl-brand-compact fl-brand-compact--auth">
        <img class="fl-brand-logo-img" src="assets/FacultyLink-logo.jpg" alt="FacultyLink" />
      </div>
      <h1 class="card-title">Set Your New Password</h1>
      <p class="muted card-sub">You must choose a new password before continuing to your dashboard.</p>
      <form id="changePwForm" class="recovery-step active" novalidate>
        <div class="field">
          <label for="np">New Password</label>
          <div class="input-wrap">
            <span class="input-icon input-icon--lock" aria-hidden="true"></span>
            <input id="np" name="newPassword" type="password" autocomplete="new-password" required />
            <button type="button" class="icon-btn" id="toggleNp" aria-label="Show new password">
              <span class="input-icon input-icon--eye" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="np2">Confirm New Password</label>
          <div class="input-wrap">
            <span class="input-icon input-icon--lock" aria-hidden="true"></span>
            <input id="np2" name="confirmPassword" type="password" autocomplete="new-password" required />
            <button type="button" class="icon-btn" id="toggleNp2" aria-label="Show confirm password">
              <span class="input-icon input-icon--eye" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <p class="muted pw-req">At least 8 characters with one letter and one number. Must differ from your temporary password.</p>
        <p class="form-error field-error" id="pwErr" role="alert"></p>
        <button class="btn-submit" type="submit" id="savePwBtn">Save New Password</button>
        <button type="button" class="link link-btn recovery-link" id="signOutBtn">Sign Out</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/change-password.js?v=1"></script>
</body>
</html>
